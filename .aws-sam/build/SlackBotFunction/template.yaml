AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Slack bot backend for issue tracking with Notion/OpenAI/Supabase state.

Globals:
  Function:
    Timeout: 30 # Default timeout in seconds for functions
    MemorySize: 512 # Default memory in MB

Resources:
  # The main Lambda function containing your Node.js app
  SlackBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SlackNotionBotFunction # Choose a name
      CodeUri: . # Points to the current directory (where index.js, package.json are)
      Handler: index.handler # File is index.js, exported function is handler
      Runtime: nodejs18.x # Or nodejs20.x - choose based on your Node version
      Architectures:
        - x86_64 # Or arm64 if preferred
      Environment:
        Variables:
          # Pass environment variables needed by your index.js
          # --- SECURITY WARNING ---
          # DO NOT commit sensitive keys directly here in plaintext.
          # Use AWS Secrets Manager or SSM Parameter Store (SecureString) and reference them,
          # or fetch them within your Lambda code (requires IAM permissions).
          # For demonstration, placeholders are shown using Parameters below:
          LOG_LEVEL: info
          NOTION_DATABASE_ID: !Ref NotionDatabaseId # Reference parameters below
          SLACK_BOT_TOKEN: !Ref SlackBotTokenParameter
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecretParameter
          NOTION_API_KEY: !Ref NotionApiKeyParameter
          OPENAI_API_KEY: !Ref OpenaiApiKeyParameter
          # AWS SDK v3 automatically uses region from Lambda Execution Environment
          # AWS_REGION: !Ref AWS::Region # Usually not needed to set explicitly for SDK v3
      Events:
        # API Gateway endpoint for Slack Events
        SlackEventApi:
          Type: Api
          Properties:
            Path: /webhook/slack/event
            Method: post
        # API Gateway endpoint for Slack Interactive Components
        SlackInteractiveApi:
          Type: Api
          Properties:
            Path: /webhook/slack/interactive
            Method: post
      # Optionally define specific IAM policies if your function needs access
      # to other AWS services like Secrets Manager, Parameter Store, S3 etc.
      # For example, if using Secrets Manager:
      # Policies:
      #   - SecretsManagerReadPolicy:
      #       SecretArn: !Ref YourSecretsArnParameter # You would need to add YourSecretsArnParameter

# --- Parameters for Sensitive Data (Passed during deployment) ---
# Use these to avoid hardcoding secrets in the template.
# When deploying with `sam deploy --guided`, you'll be prompted for these.
Parameters:
  NotionDatabaseId:
    Type: String
    Description: Notion Database ID for the issue tracker.
  SlackBotTokenParameter:
    Type: String
    Description: Slack Bot Token (OAuth Token).
    NoEcho: true # Masks the value in CloudFormation console
  SlackSigningSecretParameter:
    Type: String
    Description: Slack App Signing Secret.
    NoEcho: true
  NotionApiKeyParameter:
    Type: String
    Description: Notion API Integration Key.
    NoEcho: true
  OpenaiApiKeyParameter:
    Type: String
    Description: OpenAI API Key.
    NoEcho: true

Outputs:
  # Output the API Gateway endpoint URL after deployment
  SlackBotApiEndpoint:
    Description: "API Gateway endpoint URL for Slack Bot"
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod # Assumes default stage 'Prod'
